name: Deploy Documentation

on:
  push:
    branches:
      - main
    # The book, and everything the browser demo under demo/ builds from.
    paths:
      - 'book/**'
      - 'packages/nano-ui/**'
      - 'packages/nano-ui-emit/**'
      - 'packages/nano-ui-ttf/**'
      - 'packages/nano-ui-sdl-web/**'
      - 'packages/nano-ui-diagrams/**'
      - 'packages/nano-ui-demo/**'
      - 'packages/nano-ui-svg/app/**'
      - 'cabal.project.wasm'
      - '.github/workflows/deploy-book.yml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # The browser demo, built by the Web workflow into its web-demo artifact.
  web:
    uses: ./.github/workflows/web.yml

  build-and-deploy:
    needs: web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: Build with mdBook
        run: mdbook build book

      # Pages takes one artifact per deployment, so the demo goes inside the
      # book's site.
      - name: Add the browser demo under demo/
        uses: actions/download-artifact@v4
        with:
          name: web-demo
          path: book/book/demo

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

      # deploy-pages looks the artifact up once, and GitHub's list of a
      # run's artifacts can lag an upload it has already confirmed, which
      # fails with "No artifacts named github-pages were found". A failed
      # lookup creates no deployment, so a second try after a wait is safe.
      # Re-running the job does not help: it uploads a second artifact of
      # the same name, which deploy-pages also refuses.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for the artifact to be listed
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (second try)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book
