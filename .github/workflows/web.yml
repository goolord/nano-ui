name: Web

# Builds the browser demos with GHC's wasm backend (ghc-wasm-meta) and the
# WASI builds of FreeType, HarfBuzz, SDL3 and SDL3_ttf, loads each page in
# headless Chrome, and uploads the site as the web-demo artifact: the
# cookbook at its root, the web backend's own demo under minimal/. The Pages
# workflow (deploy-book.yml) calls this one and publishes the artifact under
# the book's demo/ directory.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# github.workflow is the caller's name when deploy-book.yml calls this, so
# that run and this workflow's own push run do not cancel each other.
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghc-wasm-meta's commit and GHC flavour. Moving either rebuilds the
  # toolchain and everything cached after it.
  GHC_WASM_META_REV: 8079eb96bbc63823d99ad8acaff0765532625474
  GHC_WASM_FLAVOUR: '9.14'
  WASI_PREFIX: /home/runner/.nano-ui-wasi

jobs:
  web:
    name: Web / wasm32 GHC 9.14
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config jq zstd unzip

      # The toolchain and the WASI libraries are saved as soon as they are
      # built, so a later failure does not lose them.
      - name: Restore ghc-wasm-meta
        id: ghc-wasm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ghc-wasm
            !~/.ghc-wasm/.cabal/store
            !~/.ghc-wasm/.cabal/packages
          key: ghc-wasm-${{ runner.os }}-${{ env.GHC_WASM_META_REV }}-${{ env.GHC_WASM_FLAVOUR }}

      - name: Install ghc-wasm-meta
        if: steps.ghc-wasm-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/ghc-wasm-meta
          git -C /tmp/ghc-wasm-meta fetch --depth 1 https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta.git "$GHC_WASM_META_REV"
          git -C /tmp/ghc-wasm-meta checkout FETCH_HEAD
          FLAVOUR="$GHC_WASM_FLAVOUR" /tmp/ghc-wasm-meta/setup.sh

      - name: Save ghc-wasm-meta
        if: steps.ghc-wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ghc-wasm
            !~/.ghc-wasm/.cabal/store
            !~/.ghc-wasm/.cabal/packages
          key: ${{ steps.ghc-wasm-cache.outputs.cache-primary-key }}

      - name: Put ghc-wasm-meta on the path
        run: ~/.ghc-wasm/add_to_github_path.sh

      # The script's hash covers the library tags it fetches and the flags
      # it builds them with.
      - name: Restore the WASI libraries
        id: wasi-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WASI_PREFIX }}/include
            ${{ env.WASI_PREFIX }}/lib
            ${{ env.WASI_PREFIX }}/share
          key: wasi-deps-${{ runner.os }}-${{ env.GHC_WASM_META_REV }}-${{ hashFiles('packages/nano-ui-sdl-web/scripts/build-wasi-deps.sh') }}

      - name: Build FreeType, HarfBuzz, SDL3 and SDL3_ttf for wasm32-wasi
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        run: packages/nano-ui-sdl-web/scripts/build-wasi-deps.sh "$WASI_PREFIX"

      - name: Save the WASI libraries
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WASI_PREFIX }}/include
            ${{ env.WASI_PREFIX }}/lib
            ${{ env.WASI_PREFIX }}/share
          key: ${{ steps.wasi-cache.outputs.cache-primary-key }}

      - name: Point pkg-config at the WASI libraries
        run: echo "PKG_CONFIG_PATH=$WASI_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: |
          wasm32-wasi-cabal update
          wasm32-wasi-cabal build --project-file=cabal.project.wasm --dry-run \
            nano-ui-sdl-web:exe:nano-ui-sdl-web-demo nano-ui-demo:exe:nano-ui-web-cookbook

      - name: Restore the wasm Cabal store
        id: store-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ghc-wasm/.cabal/store
            ~/.ghc-wasm/.cabal/packages
          key: wasm-store-${{ runner.os }}-${{ env.GHC_WASM_META_REV }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: wasm-store-${{ runner.os }}-${{ env.GHC_WASM_META_REV }}-

      - name: Build the cookbook
        run: packages/nano-ui-sdl-web/scripts/build-web.sh dist-web nano-ui-demo:exe:nano-ui-web-cookbook

      - name: Build the web backend's demo
        run: packages/nano-ui-sdl-web/scripts/build-web.sh dist-web/minimal

      - name: Save the wasm Cabal store
        if: steps.store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ghc-wasm/.cabal/store
            ~/.ghc-wasm/.cabal/packages
          key: ${{ steps.store-cache.outputs.cache-primary-key }}

      # Loads each page in the runner's Chrome with Playwright (from
      # ghc-wasm-meta's Node.js packages): the first frame must draw, a click
      # must redraw it (the cookbook's About button, the counter's +), and
      # the page must log no errors.
      - name: Load the pages in headless Chrome
        run: |
          node packages/nano-ui-sdl-web/scripts/smoke-test.cjs dist-web 1144 35 smoke-cookbook.png
          node packages/nano-ui-sdl-web/scripts/smoke-test.cjs dist-web/minimal 80 104 smoke-minimal.png
        env:
          SMOKE_CHROME: /usr/bin/google-chrome

      - name: Upload the smoke test's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshots
          path: smoke*.png
          if-no-files-found: ignore

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: dist-web
          if-no-files-found: error
