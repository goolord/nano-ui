<!doctype html>
<!--
  GitHub Pages 404 fallback. The book previously lived at the site root before
  moving under book/, so any missing path outside book/ and demo/ redirects
  there automatically. Links are absolute because 404.html can be served at
  any path depth.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found: nano-ui</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("nano-ui-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (_) {}
      const root = "/nano-ui/";
      if (!location.pathname.startsWith(root)) return;
      const rest = location.pathname.slice(root.length);
      const first = rest.split("/")[0];
      // Avoid redirect loops for genuinely missing paths under book/ or demo/.
      if (rest && first !== "book" && first !== "demo") {
        location.replace(root + "book/" + rest + location.search + location.hash);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #131316;
      --panel: #222226;
      --border: #36363e;
      --text: #eceae6;
      --muted: #b0aca4;
      --link: #7cb2fa;
      --accent: #589cf6;
      --display: "Space Grotesk", "Inter", system-ui, -apple-system, sans-serif;
      --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #ecece9;
        --panel: #fcfcfb;
        --border: #dcdcd8;
        --text: #242428;
        --muted: #5f5c58;
        --link: #1d4ed8;
        --accent: #2563eb;
      }
    }
    :root[data-theme="light"] {
      --bg: #ecece9;
      --panel: #fcfcfb;
      --border: #dcdcd8;
      --text: #242428;
      --muted: #5f5c58;
      --link: #1d4ed8;
      --accent: #2563eb;
    }
    body {
      margin: 0;
      padding: 16vh 20px 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 30px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 3px;
    }
    h1 {
      font-family: var(--display);
      font-size: 28px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
    }
    a {
      color: var(--link);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 2px;
      font-weight: 500;
    }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
    nav { display: flex; flex-wrap: wrap; gap: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>There is no page at this address on the nano-ui site.</p>
    <nav aria-label="Site">
      <a href="/nano-ui/">Home</a>
      <a href="/nano-ui/book/">Book</a>
      <a href="/nano-ui/demo/">Sampler</a>
    </nav>
  </main>
</body>
</html>
