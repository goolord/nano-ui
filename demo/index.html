<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nano-ui</title>
  <!-- Preload main.wasm and JS modules immediately instead of waiting for
       main.js to finish parsing its import chain. -->
  <link rel="preload" href="main.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="modulepreload" href="main.js">
  <link rel="modulepreload" href="ghc_wasm_jsffi.js">
  <link rel="modulepreload" href="browser_wasi_shim/index.js">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1f21; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="nano-ui"></canvas>
  <script src="nano-ui-sdl-web.js"></script>
  <script type="module">
    import { start } from "./main.js";
    start(document.getElementById("nano-ui"), "main.wasm", { rtsFlags: "-T" })
      .catch((e) => { console.error(e); document.body.textContent = String(e); });
  </script>
</body>
</html>
